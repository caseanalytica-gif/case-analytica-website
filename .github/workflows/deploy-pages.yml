name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Publish the site only. Repo docs, drafts, scripts and tooling stay in
      # git but are not served.
      - name: Build site
        run: |
          rsync -a ./ _site/ \
            --exclude='.git' --exclude='.github' --exclude='.claude' \
            --exclude='.gitignore' --exclude='.DS_Store' --exclude='_site' \
            --exclude='*.md' \
            --exclude='/social/' --exclude='/video-scripts/' \
            --exclude='/linkedin-posts/' --exclude='/tools/' \
            --exclude='/cloudflare/' --exclude='/email-capture-sheets/'
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
